                pendo.location.addTransforms([
                    {
                        attr: 'search',
                        action: 'AllowOnlyKeys',
                        data: US.utils.ga.whiteListedUrlTerms
                    },
                    {
                        attr: 'search',

                        data: function () {
                            const url = new URL(window.location.href);
                            if ((false && url.pathname.includes('OpportunityApplicants'))
                                || (false && url.pathname.includes('Pools'))
                                || (false && (url.pathname.includes('Recruiter/Candidates') || url.pathname.includes('CandidateAdd')))
                                || (false && url.pathname.includes('CandidateDetail'))
                                || (false && url.pathname.includes('OfferList'))

                                || (false && url.pathname.includes('OpportunityCreate'))
                                || (false && url.pathname.includes('EmailTemplates'))

                                || (false && url.pathname.includes('OpportunityList'))
                                || (false && (/JobBoard\/[^\/]*\/Candidate\/ViewPresence[^\/]*$/.test(url.pathname)
                                     || /JobBoard\/[^\/]*\/ApplicationAssessments[^\/]*$/.test(url.pathname) || /JobBoard\/[^\/]*\/CandidateOffer[^\/]*$/.test(url.pathname)

                                   ))) {
                                            return { 'mx': '1' };
                                       }
                                },
                    }

            }

                setTimeout(updatePendoUrl, 10);

<script>
    $(function () {
        var opportunity = new US.Opportunity.CandidateOpportunityDetail({"Id":"ee090dbb-8569-42b0-84ab-de56da17abc7","Title":"University Officer","Featured":false,"FullTime":true,"HoursPerWeek":null,"JobCategoryName":"Global Impact","Locations":[{"Id":"1ebe42e2-617f-5beb-a7ba-31bcf035e0c7","LocalizedName":null,"LocalizedLocationId":"JORD2","LocalizedDescription":"Jordan Gender","Address":{"Line1":"Abdel Rahem El-Haj Mohammad St.,Fountain Plaza Building # 66 Entrance 1, 4th Floor Sweifieh","Line2":null,"City":"Amman","State":null,"PostalCode":"0000","Country":{"Id":"ae4ae602-9220-4042-af21-a057d65c0ecf","Name":"Jordan","Code":"JOR"}},"DisplayName":false,"DisplayLocationId":false,"DisplayDescription":false,"DisplayAddress":true,"DisplayStreetAddress":false,"Coordinates":{"Longitude":-64.84372009197959,"Latitude":46.16786061794418},"Shapes":null,"SourceOfTruth":1,"IsAvailableForOpportunities":true}],"PostedDate":"2026-10-25T13:00:21.384Z","UpdatedDate":"2026-10-25T12:59:56.23Z","RequisitionNumber":"UNIVE003322","Description":"\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eLocation: Amman, Jordan\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eWho We Are\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eIREX is a global solutions provider that partners with communities and institutions in the United States and around the world to cultivate leaders, expand access to education, and create economic opportunity. With deep expertise, a forward-looking vision, and world-class practices in AI for Education, Future-Ready Workforce, Higher Education Solutions, Leadership Development, and Online Safety, IREX delivers innovative and proven solutions that help people, institutions, and communities thrive in a rapidly changing world.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eIREX seeks University Officer to support donor funded programs.\u0026nbsp;\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eJob Summary\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eThe University Officer helps plan, organize, carry out, track, and document ASAS activities with partner universities. The University Advisor supervises the position and provides technical guidance. The University Officer works closely with University Advisors, ASAS technical and operations staff, university leaders, quality assurance units, faculty members, and other partners to make sure activities are completed on time, carried out consistently, and properly documented.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eThe University Officer keeps the University Advisor updated on progress, challenges, delays, missing data or documents, and any issues that need guidance or management attention. The University Advisor sets the main goals, provides technical guidance, reviews key work, and helps resolve difficult or sensitive issues.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eThe University Officer also carries out other duties assigned by the manager to support the needs of the project team and the organization.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eWe\u0027re looking for our next team member\u0026mdash;could it be you?\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u0026nbsp;\u003cstrong\u003eWhat You\u0026rsquo;ll Do\u003c/strong\u003e\u003c/p\u003e\n\u003cul style=\u0022text-align: justify;\u0022\u003e\n\u003cli\u003e\u003cstrong\u003eProgram Operations \u0026amp; Administration:\u003c/strong\u003e The main duties are to support the HEICAT and PIAP processes, follow up on university in-kind contributions, and help with quality assurance activities under the ASAS Year 4 work plan. The University Officer keeps clear and accurate records, works with university focal points, tracks agreed actions and deadlines, prepares progress updates, and reports issues that need technical or management support.\u0026nbsp;\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eParticipant, Partner \u0026amp; Stakeholder Engagement: \u003c/strong\u003eCoordinate regularly with university focal points, faculty members, quality assurance units, and other partners. Schedule meetings and activities, communicate requirements and deadlines, follow up on agreed actions, respond to routine questions, and maintain clear records of participation, feedback, and decisions.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFinance, Procurement \u0026amp; Grant Support: \u003c/strong\u003eSupport the collection and review of activity documentation, university in-kind contribution records, procurement requests, invoices, and other supporting documents. Coordinate with operations and finance staff to ensure submissions are complete, accurate, and provided on time.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTeam Collaboration \u0026amp; Continuous Improvement:\u003c/strong\u003e Work closely with ASAS technical and operations teams, share updates and lessons learned, identify implementation challenges, and suggest practical improvements to tools, processes, and activity delivery.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGrowth \u0026amp; New Business Support: \u003c/strong\u003eContribute information, data, success stories, and supporting documents for reports, presentations, proposals, and other program-development needs, as requested.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eOur Culture is Our People:\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eAt IREX, our culture is built on our people\u0026mdash;and on how we work together to create meaningful impact every day. We look for colleagues who bring purpose, \u003cstrong\u003eintellectual curiosity, collaborative problem solving, \u003c/strong\u003eand a \u003cstrong\u003eresults driven,\u003c/strong\u003e bias for action to help strengthen communities and advance our mission.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eSuccessful candidates build trust across differences, move ideas into action, seek new perspectives, \u003cstrong\u003eembrace change\u003c/strong\u003e, and represent IREX with authenticity and professionalism. We value people who bring strong expertise and a generous team spirit to work that advances our mission.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eSkills \u0026amp; Experience \u003c/strong\u003e\u003c/p\u003e\n\u003cul style=\u0022text-align: justify;\u0022\u003e\n\u003cli\u003eExperience working with universities, higher education institutions, teacher education programs, quality assurance units, or institutional reform initiatives.\u003c/li\u003e\n\u003cli\u003eFamiliarity with Jordan\u0026rsquo;s higher education and pre-service teacher education context.\u003c/li\u003e\n\u003cli\u003eExperience supporting institutional assessments, improvement plans, accreditation-readiness activities, or quality assurance processes.\u003c/li\u003e\n\u003cli\u003eExperience tracking institutional or partner in-kind contributions.\u003c/li\u003e\n\u003cli\u003eExperience with data-visualization tools such as Power BI.\u003c/li\u003e\n\u003cli\u003eFamiliarity with document-management and collaboration platforms such as Microsoft SharePoint.\u003c/li\u003e\n\u003cli\u003eExperience working on donor-funded education or institutional-strengthening programs.\u003c/li\u003e\n\u003cli\u003eFamiliarity with HEICAT, PIAP, or comparable institutional assessment and performance-improvement tools.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003cstrong\u003eRequirements: \u003c/strong\u003e\u003c/p\u003e\n\u003cul style=\u0022text-align: justify;\u0022\u003e\n\u003cli\u003eBachelor\u0026rsquo;s degree in Project Management, Business Development, Data Analysis, Business Administration, Education, Higher Education Administration, Quality Assurance, or another related field.\u003c/li\u003e\n\u003cli\u003eAt least three years of relevant professional experience in project or program implementation, higher education programming, stakeholder coordination, quality assurance, monitoring and evaluation, data management, institutional development, or another relevant area.\u003c/li\u003e\n\u003cli\u003eDemonstrated experience coordinating activities with multiple stakeholders and following up on agreed actions and deadlines.\u003c/li\u003e\n\u003cli\u003eExperience collecting, organizing, checking, analyzing, and reporting quantitative and qualitative data.\u003c/li\u003e\n\u003cli\u003eExperience maintaining project trackers, implementation records, monitoring tools, and supporting documentation.\u003c/li\u003e\n\u003cli\u003eExperience preparing reports, presentations, meeting documentation, and implementation updates.\u003c/li\u003e\n\u003cli\u003eStrong proficiency in Microsoft Office applications, particularly Excel, Word, PowerPoint, Outlook, and Teams.\u003c/li\u003e\n\u003cli\u003eFluency in Arabic and professional working proficiency in English.\u003c/li\u003e\n\u003cli\u003eValid proof of unrestricted authorization to work in Jordan.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eYou must have unrestricted authorization to work in the United States.\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eWhat We Offer\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eAt IREX, you\u0026rsquo;ll work alongside committed, passionate, and collaborative colleagues who are united by a shared mission\u0026mdash;making it a truly rewarding place to work. We offer learning, development, and growth opportunities, along with a comprehensive benefits package designed to support your overall well-being.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eIf you are excited by IREX\u0026rsquo;s mission and see yourself contributing to this work, we encourage you to apply\u0026mdash;even if your experience does not align with every preferred qualification. We value a range of backgrounds and experiences and are especially interested in candidates who bring curiosity, initiative, strong collaboration skills, and a commitment to meaningful global impact.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003ePlease note: While we aim to offer competitive compensation, not all candidates will be eligible for the upper end of the salary range.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eDisability Specifications\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eIREX will make reasonable accommodations in compliance with the Americans with Disabilities Act of 1990, and the Americans with Disabilities Act Amendments of 2008.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eEqual Opportunity Employer\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003eIREX seeks to attract the best-qualified candidates who support IREX\u0026rsquo;s mission and who respect and promote excellence through diversity. IREX is committed to equal opportunity and follows recruitment and selection practices that comply with all applicable employment laws. To this end, IREX recruits, hires, trains, and promotes individuals based on merit and experience.\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eWe conduct background checks on all successful candidates.\u003c/strong\u003e\u003c/p\u003e\n\u003cp style=\u0022text-align: justify;\u0022\u003e\u003cstrong\u003eThis position is not eligible for Immigration Sponsorship. \u003c/strong\u003eNO PHONE CALLS PLEASE\u003c/p\u003e","EqualOpportunityEmployerDescription":null,"PayTransparencyPolicyStatement":null,"MatchScore":1.0,"HasApplied":false,"ApplicationJobBoardName":null,"ApplicationJobBoardId":null,"DateApplied":null,"Salaried":true,"CompensationAmount":null,"PublishingStatus":1,"Links":[],"BehaviorCriteria":[],"MotivationCriteria":[],"EducationCriteria":[],"LicenseAndCertificationCriteria":[],"SkillCriteria":[],"WorkExperienceCriteria":[],"JobBoardMemberships":[{"JobBoardId":"dca03d68-3ff7-4d13-b362-9b3749e9c107","PublishedInternal":true,"PublishedExternal":true,"ExternalPostedDate":"2026-10-25T13:00:21.381Z","InternalPostedDate":"2026-10-25T13:00:21.381Z"},{"JobBoardId":"86f30819-0126-446a-84bb-cf37a5e878c1","PublishedInternal":true,"PublishedExternal":true,"ExternalPostedDate":"2026-10-25T13:00:21.381Z","InternalPostedDate":"2026-10-25T13:00:21.381Z"}],"AssessmentUri":null,"AssessmentStatus":null,"OpportunityIsClosed":false,"TravelRequired":null,"TravelDescription":null,"SupervisorName":null,"Assessments":[],"ApplicationId":null,"CompensationAnnualMinimum":null,"CompensationAnnualMaximum":null,"CompensationHourlyMinimum":null,"CompensationHourlyMaximum":null,"CompensationCurrencyCode":null,"CompensationCurrency":null,"JobLocationType":null,"PayRangeVisible":false,"PayRange":{"PayRangeMinimum":null,"PayRangeMaximum":null},"PayRangeCurrencyCode":"USD","OpportunityType":0});

    <script>
        function escapeHtml(text) {
            if (text == null) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('showBanner') === 'true') {
                const banner = document.getElementById('Successbanner');
                const bannerMessage = escapeHtml($.t("Common.QuickApply.SuccessBannerMessage"));
                const bannerAction = escapeHtml($.t("Layout.AccessibilityBanner.DismissMessage"));
                if (banner) {
                    var ugkBanner = document.createElement('ukg-banner');
                    ugkBanner.setAttribute('inline', '');
                    ugkBanner.setAttribute('type', 'success');
                    ugkBanner.textContent = bannerMessage;

                    var endDiv = document.createElement('div');
                    endDiv.setAttribute('slot', 'end');

                    var ugkButton = document.createElement('ukg-button');
                    ugkButton.setAttribute('aria-label', 'banner-action');
                    ugkButton.setAttribute('emphasis', 'low');
                    ugkButton.textContent = bannerAction;
                    ugkButton.addEventListener('click', dismissBanner);

                    endDiv.appendChild(ugkButton);
                    ugkBanner.appendChild(endDiv);

                    banner.innerHTML = '';
                    banner.appendChild(ugkBanner);
                    banner.style.display = 'block';
                }
            }
        });
        function dismissBanner() {
            const banner = document.getElementById('Successbanner');
            if (banner) {
                banner.style.display = 'none';
            }
        }
        </script>
    <script>
            $(function () {
                // Clears out Matchinator session data
                $("#LogOutButton").click(function () {
                    US.utils.localStorage.removeItem('personalizedSearchProfile');
                    return true;
                });

                $("#skipLink").click(function () {
                    SkipToMainContent();

                });

                $("#skipLink").keyup(function (e) {
                    if (e.keyCode == 13) {
                        SkipToMainContent();
                    }
                });

                function SkipToMainContent() {
                    var ele = $("#PageContainer");
                    if (ele.length > 0) {
                        var scrollTopValue = ele.offset().top;
                        // Toggle-aware scroll value: sanitize when security fix is enabled
                        var scrollValue = true
                            ? Math.floor(Math.max(0, scrollTopValue))  // Security ON: sanitize (safe integer, non-negative)
                            : scrollTopValue;                          // Security OFF: original (backward compatible)

                        $('html, body').animate({
                            scrollTop: scrollValue
                        });

                        var headingEle = ele.find('h1:first, h2:first').eq(0);
                        var focusableElement;
                        if (headingEle.length > 0) {
                            focusableElement = headingEle;
                        } else {
                            focusableElement = ele;
                        }
                        focusableElement.attr("tabindex", "-1").css("outline", "none").focus();

                        return false;
                    }
                }

                $(window).resize(function () {
                    if ($(window).width() <= 767) {
                        $(".nav-pills.nav-responsive").addClass("nav-stacked");
                    } else {
                        $(".nav-pills.nav-responsive").removeClass("nav-stacked");
                    }
                });
                $(window).resize();
            });
        </script>
