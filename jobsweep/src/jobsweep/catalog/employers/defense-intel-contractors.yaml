# Employer registry -- defense tech, intelligence-data firms and government research contractors
# (lanes: regional-research-specialist, defense-intel-data; also strategic-intelligence, osint,
#  threat-intelligence, counterterrorism; supply-chain / sanctions data firms also carry
#  geopolitical-risk / sanctions-fincrime groups).
#
# Coverage (researched 2026-10-25; every non-"other" board was hit through its public API in this session and
# open_jobs is the count it returned -- Workday totals display-cap at 2000):
#   * Defense tech: Palantir, Anduril, Shield AI, Scale AI, Saronic, Helsing (London), Adarga (UK).
#   * Intelligence / geospatial / OSINT data: Vannevar Labs, Rhombus Power, HawkEye 360, BlackSky, Planet, Vantor
#     (ex-Maxar Intelligence), Air (ex-Govini), Babel Street, Strider, Sayari, Janes, Altana, Exiger, Two Six
#     Technologies, C4ADS; manual: Primer, Interos, BigBear.ai, Expedition Technology, Windward, In-Q-Tel.
#   * Government services contractors hiring all-source / OSINT / targeting / GEOINT / language & regional analysts:
#     Booz Allen, CACI, Leidos, GDIT, KBR, Parsons, Northrop Grumman, Guidehouse, Amentum (sweepable, with
#     search_terms + title_filter); manual: SAIC, ManTech, Peraton, BAE Systems, Lockheed Martin, Accenture Federal,
#     Deloitte, SOSi, HII Mission Technologies, Culmen, Chenega, Mission Essential, Amyx, SPA, DCS, Prescient Edge,
#     Noblis, Riverside Research, QinetiQ.
#   * FFRDCs / UARCs / defense research nonprofits: RAND, ANSER (sweepable); MITRE, CNA, IDA, JHU APL,
#     MIT Lincoln Lab, GTRI (manual).
#   Title filters: CONTRACTOR filter (intel / OSINT / targeting / GEOINT / SIGINT / language / regional / CT / IO
#   vocabulary, excludes "Artificial/Business Intelligence") on the big contractor boards; DEFENSE-TECH filter
#   (drops engineering / production / finance titles, keeps analyst / strategy / BD-ops / intelligence titles) on the
#   big startup boards.
#
# Notable gaps / caveats:
#   * Unsupported ATS (manual list): iCIMS (Peraton, BigBear.ai, Culmen, Chenega, Amyx, SPA, Noblis, Riverside,
#     In-Q-Tel, JHU APL), Taleo Business Edition (IDA, DCS), Avature (ManTech, Deloitte), Brassring behind Phenom
#     (BAE Systems), Eightfold (Lockheed Martin), SuccessFactors (MIT Lincoln Lab, HII Mission Technologies,
#     QinetiQ), Dayforce (CNA), HiBob (Primer), Paycor (Interos), Gem (Expedition Technology), Comeet (Windward),
#     HRSmart (Prescient Edge), custom/blocked (SAIC jobs.saic.com 403, SOSi behind Incapsula, Accenture Federal,
#     GTRI, Mission Essential). iCIMS boards sit behind an AWS WAF captcha from this egress.
#   * MITRE's Workday site (mitre/wd5/MITRE) is unlisted: job detail endpoints work but the list endpoint returns
#     0, so it is manual via its Phenom front end.
#   * Dropped: Centauri (acquired by KBR), Rebellion Defense (Greenhouse board empty), Premise (no public board
#     found), Valiant Integrated Services (website parked; jobs only on ClearanceJobs; mostly senior ex-military
#     trainer roles), Castelion / Epirus / Applied Intuition (engineering-only boards, no analyst hiring),
#     Penn State ARL (Workday board is all of Penn State; ARL postings are engineering), Thomson Reuters Special
#     Services (no TRSS-tagged analyst roles found on the TR Workday board), "Ronin" (could not identify).
#   * Most contractor analyst roles require an active TS/SCI; entry-level ("Junior", "Analyst I", "Associate")
#     postings exist at Booz Allen, Leidos, CACI, Amentum, SPA, CNA, ANSER and the data startups.
