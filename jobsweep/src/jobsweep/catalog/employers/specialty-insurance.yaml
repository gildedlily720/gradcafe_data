# Specialty insurance (underwriting and broking) -- employer registry for jobsweep.
#
# Coverage (researched 2026-10-25): Lloyd's / London-market carriers and syndicates, US & Bermudian specialty
# carriers, reinsurers, trade-credit insurers, specialty / reinsurance / wholesale brokers, transactional-risk
# (R&W) MGAs, K&R crisis-response consultancies, insurance law firms, shipping-finance brokers, political-risk
# DFIs, and the large US carriers / TPAs / data firms that run insurance-fraud SIU units.
# Every sweepable entry (ats != other) was verified live in this session via the board API (probe_ats.py check
# or curl against the ARCHITECTURE.md 3.1 endpoint); open_jobs is the count seen on 2026-10-25.
#
# Big generalist boards carry search_terms (server-side; Workday search is relevance-ranked OR-matching, so the
# narrow terms come first and max_jobs is raised where needed) plus a title_filter so that only lane-relevant
# titles survive. SIU-only carriers (GEICO, USAA, Allstate, Sedgwick) are filtered to SIU / fraud / investigator
# titles regardless of board size.
#
# Notable gaps / notes:
#   * Unsupported ATSs ("check by hand"): Beazley, Berkley, Aon, Gallagher, AXA XL (iCIMS); Lockton (Taleo);
#     Swiss Re, Munich Re, Zurich, Aspen, OdysseyRe-style SuccessFactors sites; Allianz and QBE (Phenom -- QBE's
#     Workday site qbe/wd3/QBE-Careers exists but its public listing API returns 0, jobs are only exposed through
#     careers.qbe.com); Liberty Mutual / LSM (Avature); Alliant, Crisis24 (Dayforce); Brit (Salesforce).
#   * Control Risks and Hamilton use Workable, which rate-limited this session (HTTP 429 / Cloudflare 1015);
#     they are listed as manual here -- Control Risks' board (control-risks-6) is carried as sweepable by
#     intelligence-security.yaml, which loads first and wins the merge.
#   * Dropped / folded in: Ince (administration 2022, now Lawfront), Woodruff Sawyer (now Gallagher), Risk
#     Strategies / DeWitt Stern (now Brown & Brown), TigerRisk (Howden Re), Willis Re (Gallagher Re), Navigators
#     (The Hartford), Roanoke (Munich Re), NYA (Gallagher), Founder Shield (Baldwin Group), Talbot (AIG),
#     Price Forbes (Ardonagh Specialty), Tokio Marine Kiln / SCR (Tokio Marine HCC), Fidelis Insurance Group
#     (renamed Pelagos Insurance Capital, May 2026; underwriting sits with The Fidelis Partnership).
#   * Not found / too small to list: Sovereign Risk Insurance, Texel, BPL Global, Pool Re, Equinox Global,
#     Hostage US, Coalition Against Insurance Fraud (no careers pages or unreachable), Holborn, Inigo, Ki,
#     Mosaic Insurance, Vantage Risk, Atrium, Ark (careers pages blocked bots / no ATS found).
