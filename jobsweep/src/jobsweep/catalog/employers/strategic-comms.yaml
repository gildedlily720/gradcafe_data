# Employer registry -- group: strategic-comms
# Strategic communications & advisory research, crisis / issues management, public & government affairs,
# reputation / stakeholder / media analysis, insights & monitoring.
#
# Coverage (researched 2026-10-25; every non-"other" board was hit through its public API this session):
#   * Strategic-comms / crisis / financial-comms advisories (NYC, DC, London): Teneo, FGS Global, Brunswick,
#     Edelman (incl. Smithfield, DXI), Burson (BCW + Hill & Knowlton, incl. ex-BSG insights and Direct Impact),
#     Weber Shandwick, FleishmanHillard, Golin Ketchum, Portland (Omnicom), FTI Consulting Strategic Comms,
#     APCO, Prosek, Joele Frank, Ruder Finn, Purple Strategies, Citigate Dewe Rogerson, MHP Group, Grayling.
#   * Public / government affairs consultancies: Penta (incl. Hamilton Place Strategies; US + Europe boards),
#     BerlinRosen, Global Strategy Group, Precision Strategies, Signal Group, Flint Global, Hanbury Strategy;
#     manual: DGA Group, SKDK, Mercury, Brownstein, Akin, Invariant, Subject Matter, Seven Letter, Kivvit,
#     Marathon, Hilltop, Capalino, Public First, Global Counsel.
#   * Insights / monitoring / polling: Morning Consult, Meltwater, Muck Rack, Signal AI, Cision, Brandwatch,
#     Hootsuite (Talkwalker), PeakMetrics, Ipsos, YouGov, Gallup, Pew Research Center, GQR, PSB Insights,
#     RepTrak; manual: Harris Poll, Onclusive.
#   * Policy / political intelligence platforms: Quorum, FiscalNote (CQ), POLITICO (Pro, AgencyIQ), National
#     Journal, Dods; manual: Bloomberg (Bloomberg Government).
#   Omnicom's agencies (Weber Shandwick, FleishmanHillard, Golin Ketchum, Portland) share one ~1,900-job
#   Workday board (interpublic/wd5/OMC); each entry pulls only its own brand via search_terms plus a
#   title_filter, and open_jobs records that brand search's count rather than the whole board.
#
# Notable gaps / caveats:
#   * DGA Group (incl. Albright Stonebridge) runs UKG Pro on the new host dgahr.rec.pro.ukg.net (9 jobs on
#     2026-10-25). The ultipro adapter accepts 'host/TENANT/guid', but validate_catalog.py only accepts
#     'TENANT/guid' and recruiting.ultipro.com answers 404 for this tenant, so it is listed manually.
#   * Bully Pulpit Interactive (Workable account 'bully-pulpit-international', 16 jobs on its careers page) and
#     Rational 360 (Workable 'rational-360'): Workable's API was Cloudflare rate-limiting this egress (HTTP 429
#     "error code 1015") for the whole session. Both stay manual until a check succeeds.
#   * Unreachable from the research egress (TLS handshake failures / 503): Sard Verbinnen, SKDK, Kivvit,
#     Hilltop, Capalino, Abernathy MacGregor (H/Advisors). The first five are listed manually; H/Advisors
#     has no public board (its Havas Workday sites carry no H/Advisors roles), so it is left out.
#   * Unsupported or no ATS (manual list): Kekst CNC (Publicis Jibe -> iCIMS), Harris Poll (iCIMS), Bloomberg
#     (Avature), Brownstein (viRecruit), Onclusive (LinkedIn only), Public First and Global Counsel
#     (Cloudflare-blocked sites), and boutiques that hire by email or a site form (Gladstone Place, Marathon,
#     Seven Letter, Subject Matter, Invariant, Headland).
#   * Dropped: Hamilton Place Strategies (merged into Penta), Hill+Knowlton (merged into Burson), Benenson
#     Strategy Group (folded into Burson), Talkwalker (part of Hootsuite; its old Lever board is empty),
#     NewsWhip (part of Sprout Social), Instinctif (part of TEAM LEWIS), Edison Research (its site now redirects
#     to SSRS), MikeWorldWide (no careers page), Echelon Insights, Navigator Research and Axios HQ (no board
#     found), "Main Street Advocacy" (not a hiring employer of note), and Holland & Knight (almost no policy
#     roles on its Workday board). Ballard Partners, Cornerstone Government Affairs, Forbes Tate and ICR post
#     roles only on LinkedIn or by email.
group: strategic-comms
