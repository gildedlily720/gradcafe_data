# Employer registry -- group: intelligence-security
# Risk / strategic intelligence, threat intelligence, protective intelligence, travel risk & crisis response,
# GSOC / watch-officer, corporate (non-cyber) security, OSINT, counterterrorism & counter-extremism.
#
# Coverage (researched 2026-10-25; every non-"other" board was hit through its public API this session):
#   * Risk-intelligence / alerting vendors: Dataminr, Recorded Future, Flashpoint, ZeroFox, Sibylline, Dragonfly
#     (now Dow Jones "Global Risk Insights"), Everbridge, Ontic, Samdesk, Factal, LifeRaft, Intel 471, Janes,
#     Babel Street, Strider, Sayari, Base Operations, Seerist/RANE/Riskline (manual).
#   * Security & risk consultancies / protective firms: Control Risks, S-RM, Concentric, Gavin de Becker,
#     Valens Global, Securitas (EU + USA boards), Crisis24/GardaWorld, International SOS, Pinkerton,
#     Allied Universal (incl. Brosnan Risk Consultants), Global Guardian, Global Rescue, Healix (manual where
#     the ATS is unsupported).
#   * Counter-extremism / OSINT NGOs: ISD, Moonshot, CIR, SPLC, ACLED, Blackbird.AI, Graphika, ADL, CEP,
#     Tech Against Terrorism, Soufan Center, START (UMD), GIFCT, Bellingcat.
#   * Corporate security / GSOC / protective-intelligence teams (NYC/DC/London heavy): JPMorgan Chase, Goldman
#     Sachs, Morgan Stanley, Citi, Bank of America, BlackRock, Blackstone, American Express, NBCUniversal,
#     Disney, NYT, MSG Entertainment, NFL, MLB, Pfizer, J&J, Salesforce, Airbnb, Snap, OpenAI, Anthropic,
#     CrowdStrike; manual: Meta, Google, Amazon, Microsoft, Apple, Netflix, Uber, Bloomberg, Paramount, NBA,
#     Columbia, NYU.
#   Big generalist boards carry search_terms (server-side, Workday/Oracle/SmartRecruiters) + a title_filter.
#
# Notable gaps / caveats:
#   * Workable's API (Control Risks, LifeRaft, Moonshot, CIR, Blackbird.AI) was Cloudflare rate-limiting
#     (HTTP 429 / "error code 1015") from this egress; boards were verified via the GET widget endpoint
#     (apply.workable.com/api/v1/widget/accounts/<board>), whose counts are per-location entries.
#   * Unsupported ATS (manual list): SuccessFactors (Crisis24/GardaWorld, International SOS, Paramount, NBA),
#     iCIMS (Pinkerton, Allied Universal, ADL, NYU), JazzHR (Global Guardian), UKG Ready (Global Rescue),
#     Factorial (Riskline), HRSmart (Prescient Edge), Avature (Bloomberg), Eightfold (Microsoft, Netflix),
#     PageUp (Columbia), custom pages (Meta, Google, Amazon, Apple, Uber, Seerist, RANE, Healix, CEP, TAT ...).
#   * Not found / dropped: Silobreaker (careers page 404), Topsail and Insite Risk (sites unreachable), Prosegur
#     (no US/UK early-career intel presence), Halcyon (anti-ransomware vendor, not an intel employer),
#     Network Contagion Research Institute (site blocks bots, no public board found), Brosnan (acquired by
#     Allied Universal), Pyrra (acquired by AlertMedia), Hedayah (gov-adjacent, Abu Dhabi), WorldAware and
#     OnSolve (folded into Crisis24).
