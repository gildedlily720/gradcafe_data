# Employer registry -- group: policy-research
# Think tanks, international organisations / humanitarian and human-rights NGOs, policy-research institutes,
# criminal-justice and urban/social-policy research orgs (NYC-heavy), policy-adjacent trade bodies, and
# newsrooms / publications that hire researchers, fact-checkers, editorial assistants and fellows.
#
# Coverage (researched 2026-10-25; every non-"other" board was hit through its public API this session,
# using the jobsweep adapters themselves, and open_jobs is the count they returned):
#   * Foreign policy / national security think tanks (DC/NY/London): CSIS, RAND, Hudson, Heritage, Cato, CNAS,
#     MEI, Quincy, GMF, ISW, BPC, Third Way, Manhattan Institute, Partnership for Public Service, Japan Society,
#     Chatham House (Teamtailor), ECFR (Personio), International Crisis Group (Recruitee); manual: CFR, Brookings,
#     Carnegie, Atlantic Council, AEI, Stimson, New America, FDD, Washington Institute, IISS, RUSI, NCUSCR, CAP,
#     Niskanen, R Street, PIIE.
#   * Social-policy / evaluation research: Urban Institute, Pew Research Center, Pew Charitable Trusts, Abt Global,
#     AIR, Child Trends, Results for America, Data & Society, IIF; manual: MDRC, Mathematica, NORC.
#   * Criminal justice and NYC social / urban policy: Vera, Council on Criminal Justice, Arnold Ventures, ACLU,
#     Robin Hood, United Way of NYC, Community Service Society, LISC, NYCEDC; manual: Brennan Center, Center for
#     Justice Innovation, Fortune Society, CSG Justice Center.
#   * International organisations / humanitarian / rights: IMF, OECD, UNDP, WFP, IRC, Mercy Corps, Save the
#     Children, HRW, Amnesty USA, NED, NDI, IRI, GI-TOC, PEN America, CPJ; manual: World Bank, UN Secretariat.
#   * Newsrooms / publications (research-writing): NYT, WSJ/Dow Jones, Reuters, Washington Post, The Atlantic,
#     Conde Nast (New Yorker), The Economist, FT, Politico (US + Europe), Axios, Semafor, NPR, ProPublica,
#     The Marshall Project, CQ Roll Call (FiscalNote), FactCheck.org (via Penn's Workday); manual: AP.
#   Big generalist boards (Reuters, Conde Nast, IRC, Save the Children, Washington Post, Penn) carry a title_filter
#   and, where the board is > 400 jobs, server-side search_terms.
#
# Notable gaps / caveats:
#   * Cloudflare / Incapsula bot walls blocked most think-tank careers pages, so several boards were found via
#     the orgs' WordPress REST API, pac.org job pages or ATS-slug probing instead. Workable's API was rate-limited
#     (HTTP 429 / "error code 1015") all session: Council on Criminal Justice is therefore listed as manual with
#     its Workable URL (board slug "counciloncj" taken from the org's own site, not API-verified).
#   * Unsupported ATS (manual list): iCIMS (CFR incl. Foreign Affairs, Brookings, AEI), ApplicantPro (Carnegie,
#     Stimson, FDD, CSG Justice Center), Paycom (Atlantic Council, Fortune Society), JazzHR (New America, Brennan,
#     R Street), Gusto (Niskanen), UKG Ready (MDRC), Cornerstone (Mathematica, World Bank), PageUp (NORC),
#     HeyPlumm (RUSI), UN careers portal; custom pages (CAP, PIIE, Washington Institute, IISS, NCUSCR).
#   * Registry merge order: intelligence-security.yaml loads before this file, so for new-york-times and dow-jones
#     its security-oriented title_filter wins and newsroom research/editorial titles are dropped. Fix belongs in
#     EmployerRegistry (merge/OR title filters) - reported, not changed here.
#   * Dropped / not found: Wilson Center (largely shut down after the 2025 executive order; residual posts go via
#     USAJOBS), Belfer Center / Hoover (university-wide boards: Harvard, Stanford Oracle on a custom domain the
#     validator does not accept), Lawfare, War on the Rocks, Puck, Rest of World, Foreign Policy, Snopes, Lead
#     Stories, Poynter (no public ATS board found; pages bot-walled), Regional Plan Association, Citizens Budget
#     Commission, Center for an Urban Future, Citizens' Committee for Children, MAS, Pratt Center (email / no
#     board), SIFMA (UKG Ready), US Chamber (Dayforce), BPI, TechNet, ITI, CCIA, Blockchain Association,
#     Coin Center, EPIC (custom pages, not verified). Lever "brookings", Pinpoint "bipartisanpolicy" /
#     "instituteforgovernment" / "uli" and GH "robinhood" / "rpa" / "ccj" are vendor demo boards or different
#     companies - do not use.
