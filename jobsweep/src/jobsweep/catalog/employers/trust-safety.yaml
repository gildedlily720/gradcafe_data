# Employer registry -- group: trust-safety
# Lanes: trust-safety-policy, policy-enforcement-ai-safeguards, ai-policy-forecasting, election-integrity,
#        disinformation, human-rights.
#
# Coverage (researched 2026-10-25; 90 employers, 51 sweepable - every one hit through its public
# ATS API this session - and 39 manual 'check by hand' entries):
#   * AI labs: OpenAI, Anthropic, xAI/X, Scale AI, Perplexity, Mistral, Character.AI, ElevenLabs, UK AISI;
#     Google DeepMind manual (left Greenhouse for Google Careers).
#   * Platforms: Snap, Pinterest, Reddit, Discord, Roblox, Twitch, Spotify, Airbnb, Match Group, Bumble,
#     Grindr, Wikimedia; manual: Meta, Google/YouTube/Jigsaw, Microsoft (MTAC, LinkedIn), TikTok, Etsy, Bluesky.
#     Every platform / AI-lab board carries a title_filter so only T&S / integrity / policy titles are kept.
#   * T&S vendors & child safety: Hive, Cinder, Thorn; manual: Alice (ex-ActiveFence, Comeet), NCMEC (Dayforce).
#   * Disinformation / influence ops: Alethea, Cyabra, ISD, Graphika, NewsGuard, Blackbird.AI, Moonshot, CIR,
#     CCDH, Tech Against Terrorism, Atlantic Council DFRLab.
#   * AI policy / safety research / forecasting: CSET (via Georgetown Workday + filter), RAND, Epoch AI, METR,
#     Apollo Research, Partnership on AI, FLI, Coefficient Giving (ex-Open Philanthropy), ARI, Data & Society;
#     manual: GovAI, Metaculus, FRI, IFP, Horizon, FAS, IAPS, CLTR, AI Now, CDT.
#   * Elections & democracy: Protect Democracy, NDI, IRI, Common Cause, Issue One; manual: Brennan Center,
#     Democracy Works, BPC, States United, IFES.
#   * Human rights: HRW, Amnesty USA, WITNESS, Access Now, CPJ, PEN America, BHRRC, CIVIC, ACLU; manual:
#     Amnesty International (London), Freedom House, Human Rights First, PHR, ARTICLE 19, Global Witness, OSF.
#
# Notable gaps / caveats:
#   * Workable (Blackbird.AI, Moonshot, CIR, Metaculus) answered HTTP 429 / Cloudflare 'error code 1015' to
#     every call from this egress all session, so those four are kept manual here (ats_vendor: workable); the
#     intelligence-security file lists Blackbird.AI, Moonshot and CIR as verified Workable boards under the
#     same keys, and the registry merge keeps that board.
#   * Paylocity's v2 public feed returns [] for States United even while its HTML board lists a job - the
#     paylocity adapter may need an HTML (window.pageData) fallback.
#   * Democracy Works' Greenhouse board returned 404 (unpublished between hiring rounds) - kept manual.
#   * Unsupported ATS: JazzHR (Brennan, FAS), Taleo (Freedom House), Paycor (Human Rights First), Comeet (Alice),
#     Dayforce (NCMEC), Gem (Bluesky), Clinch (Etsy), custom/Cloudflare-protected pages (CDT, IFES, BPC,
#     ARTICLE 19, Atlantic Council, Metaculus, GovAI, IFP ...).
#   * Dropped: Logically (administration 2025, assets sold), Global Disinformation Index (no current hiring
#     presence), Checkstep / Tremau / TSPA / Integrity Institute (no public board or too small), Center for
#     AI Safety (SF only; no ATS), and low-signal generalist boards (Lyft, DoorDash, eBay, Nextdoor, Patreon,
#     Substack, Mozilla, Cohere, Amazon, Uber) where T&S hiring is rare.
#   * Namesake traps: Greenhouse 'cais', 'turing', 'moonshot', 'hive' and BambooHR 'safeai', 'iri', 'cdt' are
#     unrelated companies; Lever 'hive' is the moderation vendor.
#   * Open jobs across sweepable boards at verification: 4158 (before title filters).
group: trust-safety
