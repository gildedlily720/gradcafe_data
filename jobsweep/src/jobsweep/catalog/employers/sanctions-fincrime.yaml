# Employer registry -- group: sanctions-fincrime
# Sanctions research & investigations, export controls / trade compliance, AML-KYC investigations, financial-crime
# risk & financial intelligence (FIU), illicit finance, crypto / blockchain investigations, investigative
# compliance, and market regulation / trade surveillance / enforcement.
#
# Coverage (researched 2026-10-25; every non-"other" board was hit through its public API this session and
# returned a job count -- Teamtailor boards were verified through their public jobs.rss feed):
#   * Sanctions / trade-risk data & financial-crime intelligence: Kharon, Castellum.AI (manual), Sayari, Altana,
#     Strider, Exiger, LSEG (World-Check / Risk Intelligence), Dow Jones Risk & Compliance, LexisNexis Risk
#     Solutions, Moody's (manual), Quantexa, ComplyAdvantage, Quantifind.
#   * Blockchain analytics: Chainalysis, TRM Labs, Elliptic, Merkle Science, Crystal Intelligence.
#   * Crypto exchanges / custodians / stablecoin issuers with FIU, sanctions & investigations teams: Coinbase,
#     Kraken, Circle, Ripple, Gemini, Anchorage Digital, Paxos, BitGo, Crypto.com, OKX, Robinhood.
#   * Fintech / payments FinCrime ops (AML investigations, EDD, sanctions ops): Stripe, Block, PayPal, Wise,
#     Revolut (manual), Monzo, Ramp, Brex, Mercury, Plaid, Chime, SoFi, Affirm, Marqeta, Payoneer, Remitly,
#     Western Union, Cross River Bank, Visa, Mastercard, American Express.
#   * RegTech / AML & surveillance vendors: Alloy, Sardine, Unit21 (manual), Hummingbird, Feedzai, NICE Actimize,
#     Behavox, Eventus, Silent Eight, Napier.
#   * Banks (FIU, sanctions screening, KYC/EDD, trade surveillance): JPMorgan Chase, Citi, Goldman Sachs, Morgan
#     Stanley, BNY, State Street, Bank of America, Wells Fargo, Capital One, TD, MUFG, Santander, UBS, HSBC,
#     Barclays, Deutsche Bank, BNP Paribas, Societe Generale, Standard Chartered (the last six manual).
#   * Exchanges, SROs and non-federal regulators: FINRA, NFA (manual), MSRB (manual), Nasdaq, ICE/NYSE (manual),
#     Cboe, CME Group, DTCC, Options Clearing Corporation, Kalshi, UK FCA, NYDFS (manual).
#   * Consultancies: Promontory (IBM, manual), K2 Integrity (manual), Guidehouse, Protiviti.
#   * Export compliance: Descartes (Visual Compliance, manual), Expeditors (trade compliance), Akin, Steptoe,
#     Covington (law-firm trade/sanctions practices, manual).
#   * Illicit-finance research / investigative NGOs: C4ADS, The Sentry (manual), OCCRP, RUSI (manual), FDD (manual).
#   Big generalist boards carry search_terms (server-side on Workday/Oracle) + a title_filter keeping only
#   sanctions / AML / KYC / FCC / FIU / surveillance / investigations / fraud / compliance titles.
#
# Notable gaps / caveats:
#   * Registry merge keeps the FIRST file's board, title_filter and search_terms for a shared key. intelligence-
#     security.yaml loads earlier and already lists jpmorgan-chase, goldman-sachs, morgan-stanley, citi,
#     bank-of-america, american-express, dow-jones, sayari and strider with security/intel-only filters, so the
#     fincrime search_terms/title_filter below are ignored for those keys until the merge unions them.
#   * Unsupported ATS (manual list): Phenom/Eightfold/Avature/SuccessFactors/custom at most European banks,
#     iCIMS (ICE), SuccessFactors (Moody's, Descartes), Zoho Recruit (Unit21), legacy Rippling-ATS (Castellum.AI),
#     HiBob (K2 Integrity), UKG Ready (MSRB), NAS Activate (NFA), ApplicantPro (FDD), heyplumm (RUSI).
#   * Dropped: Featurespace (acquired by Visa 2024), Treliant (now part of Huron), E2open (acquired by WiseTech,
#     no public board found), Livingston International (no public board found), Fireblocks (no fincrime hiring),
#     Fenergo (Workable API rate-limited from this egress, could not verify), Ripjar/Solidus Labs/Windward/
#     SteelEye (tiny or custom/Comeet boards).
group: sanctions-fincrime
