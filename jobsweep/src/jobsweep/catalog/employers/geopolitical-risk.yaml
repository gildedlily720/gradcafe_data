# Employer registry -- group: geopolitical-risk
# Political / country / sovereign risk, geopolitical analysis, political forecasting, geoeconomics, economic
# security, supply-chain & forced-labour risk, risk consulting, expert networks / primary research, and
# research & due-diligence roles at investment firms.  Early-career focus (analyst / associate / fellow /
# graduate programmes), New York first, then Washington DC, London and remote US.
#
# Coverage (researched 2026-10-25; every non-"other" board was hit through its public API this session):
#   * Political-risk & geopolitical advisory: Eurasia Group, Teneo, BowerGroupAsia, Ankura (now home of
#     McLarty Associates), Penta Group (absorbed Hamilton Place Strategies), Brunswick, S-RM, Capstone (DC policy
#     research for investors), FiscalNote, Morning Consult; manual: The Asia Group (HiBob), DGA Group /
#     Albright Stonebridge (UKG Pro on a custom host), Control Risks & Hakluyt (Workable, rate-limited),
#     Beacon Policy Advisors, Macro Advisory Partners, Rhodium Group, RANE, Global Counsel, Flint Global.
#   * Macro / country-risk research & ratings: Oxford Economics (incl. Alpine Macro), Economist Group (EIU),
#     Dow Jones (Oxford Analytica, Dragonfly / Global Risk Insights), Verisk (Maplecroft), S&P Global,
#     Morningstar (DBRS), KBRA, Energy Aspects (incl. Medley Advisors), Lazard (Geopolitical Advisory);
#     manual: Moody's, Fitch Group (Fitch Ratings, BMI / Fitch Solutions, GeoQuant), Bloomberg, Capital
#     Economics (Workable), BCA Research (Dayforce), TS Lombard (GlobalData).
#   * Risk consulting: Oliver Wyman (MMC Workday, server-side search "Oliver Wyman"), Grant Thornton, Protiviti.
#   * Economic security / supply chain / forced labour: SCSP, Strider, Sayari, Kharon, Altana, Exiger,
#     Everstream, Resilinc, Datenna, EcoVadis (owns Ulula), Sourcemap, C4ADS; manual: Silverado Policy
#     Accelerator, Interos (Paycor), Verite, Transparentem (HireHive).
#   * Expert networks / primary research: GLG, AlphaSights, Guidepoint, Third Bridge, AlphaSense (Tegus),
#     Coleman, Atheneum, Arbolus, NewtonX, Capvision; manual: Dialectica & proSapient (Workable), Inex One.
#   * Investment research / DD: Bridgewater, Point72, Schonfeld, Viking, Blackstone, KKR,
#     Carlyle, Apollo, TPG, Warburg Pincus, General Atlantic, Bain Capital; manual: Citadel, Two Sigma,
#     D. E. Shaw, Millennium, Balyasny, Brevan Howard.
#
# Shared keys: the registry loads files alphabetically and keeps the FIRST file's board/title_filter/search_terms
# (only groups/lanes are merged).  geopolitical-risk.yaml sorts before intelligence-security / sanctions-fincrime /
# specialty-insurance, so for shared big boards (blackstone, dow-jones) the title_filter below is the UNION of
# the other groups' filters plus this group's terms; verisk/protiviti keep the whole board (no filter) as the
# other groups do.  marsh-mclennan is deliberately NOT listed here (its insurance-tuned search_terms would be
# overridden); Oliver Wyman is a separate key on the same MMC board with its own server-side search.
#
# Notable gaps / caveats:
#   * Workable (apply.workable.com) answered HTTP 429 / Cloudflare "error code 1015" for every account all
#     session, so Control Risks (control-risks-6), Hakluyt (hakluyt), Capital Economics (capital-economics),
#     Dialectica (dialectica) and proSapient (prosapient) are listed as manual with the board slug in notes;
#     promote to ats: workable once the board API answers.  Capital Economics' slug was confirmed live via
#     jobs.workable.com search.
#   * UKG: DGA Group's board only answers on its own host (dgahr.rec.pro.ukg.net); the ultipro adapter can take
#     'host/tenant/guid' but validate_catalog.py only accepts 'tenant/guid', so it is manual for now.
#   * Unsupported ATS: SuccessFactors (Moody's, Fitch), Avature (Bloomberg, Two Sigma), Eightfold (Millennium),
#     Phenom (Brevan Howard), HiBob (The Asia Group), Dayforce (BCA Research), Paycor (Interos), HireHive
#     (Transparentem), Salesforce site (Balyasny), custom pages (Citadel, D. E. Shaw, Rhodium, Beacon Policy,
#     Macro Advisory Partners, Global Counsel, Flint Global, Silverado, Verite, Inex One, RANE by email).
#   * Dropped / folded: GeoQuant (acquired by Fitch), Oxford Analytica & Dragonfly (Dow Jones), Medley Global
#     Advisors (redirects to Energy Aspects), Hamilton Place Strategies (Penta), Albright Stonebridge (DGA),
#     McLarty Associates (Ankura), Tegus (AlphaSense), Ulula (EcoVadis), Alpine Macro (Oxford Economics).
#     Not found / not worth listing: Kissinger Associates & Greenmantle (no public careers board), FRDM (no
#     careers page), Horizon Advisory (no board), Grey Matter Research (unrelated US market-research shop),
#     Elliott (no careers page), Coatue (jobs.coatue.com is a portfolio-company Getro board), Lone Pine
#     (Greenhouse board empty), Kroll & FTI (TalentBrew/Coveo front ends, Workday tenant not found - left to
#     investigations-dd), "map"/"rhg"/"silverado"/"dga" slug collisions on other ATSs belong to unrelated orgs.
#   * Web search was unavailable (shared per-turn search budget exhausted); boards were found from careers-page
#     HTML, slug guessing and job-id lookups (GLG's board token found by resolving a job id).
