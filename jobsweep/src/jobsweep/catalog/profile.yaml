# Candidate preferences. Relevance scores and eligibility evidence are distinct.
preferred_locations: ["New York"]
remote_ok: true
max_years_experience: 3
include_internships: false
include_unknown_seniority: true
min_score: 25
countries: ["US"]

# NYC on-site/hybrid or remote explicitly permitting New York residence.
# Generic 'remote' / 'US remote' without confirmed NY eligibility goes to Needs review.
strict_nyc_location: true
screen_qualifications: true
# Do not assume specialist credentials, clearances or additional language fluency.
known_credentials: []
languages: ["English"]
active_clearances: []

# Title/function exclusions take precedence over employer/department keyword relevance.
# Program/research/underwriting assistants remain available; generic admin jobs do not.
excluded_role_patterns:
  - '\b(?:software|data|machine learning|ai|platform|cloud|network|security|systems?|analytics)\s+(?:engineer|developer|architect)\b'
  - '\b(?:engineer|developer|programmer|devops|sre|data scientist|machine learning engineer|quantitative|quant|actuary|actuarial)\b'
  - '\b(?:information technology|it|systems?|applications?|infrastructure)\s+(?:analyst|administrator|specialist)\b'
  - '\b(?:accountant|accounting|bookkeeper|bookkeeping|payroll|accounts payable|accounts receivable|controller|fund controllership)\b'
  - '\b(?:executive assistant|administrative assistant|administrative coordinator|office assistant|office manager|receptionist|workplace experience|facilities|data entry)\b'
  - '\b(?:research qa|quality assurance|data annotation|data annotator|research quality assurance)\b'
  - '\b(?:recruiter|recruiting|talent acquisition|human resources|hris|customer service|customer support|help desk|service desk)\b'
  - '\b(?:demand|supply|inventory|production)\s*(?:&|and)?\s*(?:demand|supply)?\s+planner\b'
