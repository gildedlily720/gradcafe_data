# jobsweep lanes taxonomy -- see ARCHITECTURE.md section 4.
#
# Group and lane ids and their ORDER are fixed (ARCHITECTURE.md 4.1; checked by scripts/validate_catalog.py).
# Names use the candidate's own wording.
#
# Matching conventions (implemented by taxonomy.py):
#   * Terms are case-insensitive whole-word / whole-phrase matches on the raw (un-normalised) text.
#   * A term wrapped in slashes ('/\bK&R\b/') is a raw Python regex. Raw regexes are written to work when
#     compiled with re.IGNORECASE; abbreviations that must keep their case use a scoped flag, e.g.
#     '/\b(?-i:CORE)\b/' (FEMA CORE, not "core").
#   * Every plain term starts and ends with a word character, so \b-based matchers work too.
#   * "&" and "and", hyphen and space, UK and US spellings are listed as separate variants where
#     postings use both (no normalisation is assumed).
#
# Per lane:
#   title    strong signals, matched in the job title only: job-title phrasings plus short or ambiguous
#            terms that are only trustworthy in a title (e.g. "political risk", "investigator").
#   phrases  specific signals trusted anywhere (title or description).
#   context  supporting vocabulary; never sufficient on its own.
#   exclude  title phrases that veto the lane (cyber SOC for GSOC, sales/engineering for trust & safety...).
#   queries  keyword searches for generic search sources, tuned for entry-level / early-career hits.
#   usajobs  optional USAJOBS mapping: keywords (one search each), series (JobCategoryCode), hiring_path,
#            grade_low/grade_high, organization. Series codes were checked against the USAJOBS
#            occupational-series codelist and FEMA's organization code (HSCB) against the agency
#            sub-element codelist (2026-10-25).
#   nycjobs  optional NYC Jobs mapping: keywords and exact `agency` strings from NYC Open Data
#            dataset kpav-sd4t (same NYCAPS agency names as the citywide payroll dataset), 2026-10-25.
#
# A term appears at most once per lane across title/phrases/context/exclude (tests/test_lanes_yaml.py).
# entry-routes lanes are modifiers (programme / level vocabulary); earlier-lanes are classified but
# inactive (excluded from search plans, hidden by default).

