[project]
name = "jobsweep"
version = "0.1.0"
description = "Lane-based job sweeps across ATS boards, USAJOBS, NYC Jobs and job aggregators, with a web board and an MCP server for Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
jobspy = ["python-jobspy>=1.1.80"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
jobsweep = "jobsweep.cli:main"
jobsweep-mcp = "jobsweep.mcp_server:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: hits real job-board APIs over the network (deselect with -m 'not live')"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
