name: Apply tested JobSweep repairs
on:
  push:
    paths: [".github/workflows/jobsweep-maintenance.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jobsweep-sweep
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify original files and apply reviewed repairs
        run: |
          python - <<'PYCODE'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path
          expected = json.loads(base64.b64decode(""))
          for name, checksum in expected.items():
              p = Path(name)
              actual = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              if actual != checksum:
                  raise SystemExit(f"{name} changed since review; refusing to overwrite")
          patch = gzip.decompress(base64.b64decode(""))
          subprocess.run(["git", "apply", "--check", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "-"], input=patch, check=True)
          print(f"Applied {len(expected)} reviewed source files")
          PYCODE
      - name: Install and validate
        working-directory: jobsweep
        run: |
          uv pip install -e '.[dev]'
          ruff check src tests
          ruff format --check src tests
          python scripts/validate_catalog.py
          node --test tests/*.cjs
          pytest -m "not live"
      - name: Commit tested repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobsweep
          git commit -m "Enforce NYC and qualification screening, truthful dates, and private tracking"
          git push origin HEAD:master
