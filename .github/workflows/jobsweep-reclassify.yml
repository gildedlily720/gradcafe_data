name: Refresh JobSweep requirement screening
on:
  push:
    paths: [".github/workflows/jobsweep-reclassify.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jobsweep-sweep
  cancel-in-progress: false
env:
  JOBSWEEP_DB: ${{ github.workspace }}/jobsweep/var/jobsweep.db
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply verified requirement screening update
        run: |
          python - <<'PYCODE'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path
          expected, final = json.loads(base64.b64decode(""))
          actual = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() if Path(name).exists() else None for name in expected}
          if actual != final:
              if actual != expected:
                  raise SystemExit("Source changed since review; refusing to overwrite")
              patch = gzip.decompress(base64.b64decode(""))
              subprocess.run(["git", "apply", "--check", "-"], input=patch, check=True)
              subprocess.run(["git", "apply", "-"], input=patch, check=True)
          print("Reviewed requirement parsing source is ready")
          PYCODE
      - name: Install and check requirement parsing
        working-directory: jobsweep
        run: |
          uv pip install -e '.[dev]'
          ruff check src tests
          ruff format --check src tests
          pytest -q -m "not live"
          node --test tests/*.cjs
      - name: Commit tested source
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobsweep
          git diff --cached --quiet || git commit -m "Distinguish required experience, field requirements, alternatives, and sales roles"
          git push origin HEAD:master
      - name: Restore current state
        run: |
          git fetch --depth=1 origin jobsweep-state
          git show origin/jobsweep-state:state.json.gz > "$RUNNER_TEMP/state.json.gz"
          jobsweep state import "$RUNNER_TEMP/state.json.gz"
      - name: Refresh screening without searches or changing application records
        working-directory: jobsweep
        run: |
          python scripts/reclassify_board.py
          jobsweep export --out "$RUNNER_TEMP/site"
          jobsweep state export "$RUNNER_TEMP/updated-state.json.gz" --max-description 20000
      - name: Save refreshed state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach "$RUNNER_TEMP/state-wt" origin/jobsweep-state
          cp "$RUNNER_TEMP/updated-state.json.gz" "$RUNNER_TEMP/state-wt/state.json.gz"
          git -C "$RUNNER_TEMP/state-wt" add state.json.gz
          git -C "$RUNNER_TEMP/state-wt" diff --cached --quiet || git -C "$RUNNER_TEMP/state-wt" commit -m "Refresh experience requirements and role screening"
          git -C "$RUNNER_TEMP/state-wt" push origin HEAD:jobsweep-state
      - name: Publish refreshed board
        run: |
          cd "$RUNNER_TEMP/site"
          git init -q -b gh-pages
          git add -A
          git commit -q -m "Refresh experience evidence and screening"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
