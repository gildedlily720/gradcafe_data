name: jobsweep daily sweep

on:
  schedule:
    # 11:23 UTC = 07:23 New York during EDT (06:23 during EST). Scheduled runs only fire on the default branch.
    - cron: "23 11 * * *"
  workflow_dispatch:
    inputs:
      lanes:
        description: "Comma-separated lane ids (blank = all active lanes)"
        required: false
        default: ""
      groups:
        description: "Comma-separated group ids (blank = all)"
        required: false
        default: ""
      sources:
        description: "Comma-separated source names (blank = every available non-metered source)"
        required: false
        default: ""
      verify_credentials:
        description: "Check metered-source credentials without running searches"
        type: boolean
        default: false
      include_metered:
        description: "Run today's budgeted metered searches too (always enabled on daily schedule)"
        type: boolean
        default: false
      publish_pages:
        description: "Publish the board to GitHub Pages (gh-pages branch)"
        type: boolean
        default: true
      open_issue:
        description: "Open/update the daily digest issue when there are new matches"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: jobsweep-sweep
  cancel-in-progress: false

env:
  STATE_BRANCH: jobsweep-state
  JOBSWEEP_DB: ${{ github.workspace }}/jobsweep/var/jobsweep.db

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      new_count: ${{ steps.digest.outputs.new_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Install jobsweep
        working-directory: jobsweep
        run: uv pip install -e '.[jobspy]'

      - name: Verify metered-source credentials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_credentials }}
        env:
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
          HASDATA_API_KEY: ${{ secrets.HASDATA_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          # Account reads only: no job searches, scraper runs, or response bodies in logs.
          checks = [
              ("TheirStack", "https://api.theirstack.com/v0/billing/credit-balance", "THEIRSTACK_API_KEY", "Authorization", "Bearer "),
              ("HasData", "https://api.hasdata.com/user/me/usage", "HASDATA_API_KEY", "x-api-key", ""),
              ("Apify", "https://api.apify.com/v2/users/me", "APIFY_TOKEN", "Authorization", "Bearer "),
          ]
          failed = False
          for name, url, key_name, header, prefix in checks:
              key = os.environ.get(key_name, "")
              if not key:
                  print(f"{name}: missing credential")
                  failed = True
                  continue
              try:
                  request = Request(url, headers={header: prefix + key, "Accept": "application/json"})
                  with urlopen(request, timeout=30) as response:
                      print(f"{name}: authenticated (HTTP {response.status})")
              except HTTPError as exc:
                  print(f"{name}: HTTP {exc.code}")
                  failed = True
              except Exception as exc:
                  print(f"{name}: request failed ({type(exc).__name__})")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Restore state from the state branch
        run: |
          # This deployed board already has durable state. A read/import failure
          # must stop the run, never publish an empty replacement over its history.
          git fetch --depth=1 origin "$STATE_BRANCH"
          git show "origin/$STATE_BRANCH:state.json.gz" > "$RUNNER_TEMP/state.json.gz"
          jobsweep state import "$RUNNER_TEMP/state.json.gz"

      - name: Refresh existing location, qualification, and posting-date assessments
        working-directory: jobsweep
        run: python scripts/reclassify_board.py

      - name: Sweep
        working-directory: jobsweep
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          PIPEWORX_API_KEY: ${{ secrets.PIPEWORX_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          IN_LANES: ${{ inputs.lanes }}
          IN_GROUPS: ${{ inputs.groups }}
          IN_SOURCES: ${{ inputs.sources }}
        run: |
          args=()
          [ -n "$IN_LANES" ] && args+=(--lanes "$IN_LANES")
          [ -n "$IN_GROUPS" ] && args+=(--groups "$IN_GROUPS")
          [ -n "$IN_SOURCES" ] && args+=(--sources "$IN_SOURCES")
          # Partial source errors are normal (rate limits, a board moving); never fail the whole run on them.
          jobsweep sweep "${args[@]}" --json > "$RUNNER_TEMP/sweep-report.json" || echo "::warning::sweep reported errors"

      - name: Reserve today's metered search budget
        id: metered_budget
        # Explicit source selections use the same budget path; there is no unbounded bypass.
        if: ${{ github.event_name == 'schedule' || inputs.include_metered || contains(inputs.sources, 'theirstack') || contains(inputs.sources, 'hasdata_indeed') || contains(inputs.sources, 'apify') }}
        continue-on-error: true
        env:
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
          HASDATA_API_KEY: ${{ secrets.HASDATA_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          IN_LANES: ${{ inputs.lanes }}
          IN_SOURCES: ${{ inputs.sources }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail closed if durable spending history cannot be read or saved.
          # Existing snapshots are retained unchanged until the normal save step.
          git fetch --depth=1 origin "$STATE_BRANCH"
          wt="$RUNNER_TEMP/metered-state-wt"
          mkdir -p "$wt"
          git archive "origin/$STATE_BRANCH" | tar -x -C "$wt"
          if [ -f "$wt/metered-budget.json" ]; then
            cp "$wt/metered-budget.json" "$RUNNER_TEMP/metered-budget.json"
          fi
          python -m jobsweep.metered_daily plan \
            --ledger "$RUNNER_TEMP/metered-budget.json" \
            --plan "$RUNNER_TEMP/metered-plan.json" \
            --sources "$IN_SOURCES" --lanes "$IN_LANES" | tee "$RUNNER_TEMP/metered-budget-summary.txt"
          cp "$RUNNER_TEMP/metered-budget.json" "$wt/metered-budget.json"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd "$wt"
          git init -q -b "$STATE_BRANCH"
          git add -A
          git commit -q -m "Reserve daily metered search budget $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$STATE_BRANCH"
          cat "$RUNNER_TEMP/metered-budget-summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Run budgeted daily metered searches
        if: ${{ steps.metered_budget.outcome == 'success' }}
        env:
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
          HASDATA_API_KEY: ${{ secrets.HASDATA_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python -m jobsweep.metered_daily run \
            --ledger "$RUNNER_TEMP/metered-budget.json" \
            --plan "$RUNNER_TEMP/metered-plan.json" > "$RUNNER_TEMP/metered-report.json" \
            || echo "::warning::metered searches reported an error; reserved budget will not be replayed"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'metered-report.json'
          if path.stat().st_size:
              report = json.loads(path.read_text())
              listings = sum(stats.get('jobs', 0) for stats in report.get('per_source', {}).values())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write(f"\nMetered results: {listings} listings; "
                            f"{len(report.get('new_uids', []))} new jobs.\n")
                  for error in report.get('errors', []):
                      out.write(f"\n- {error.get('source')}: search failed; see metered report.\n")
          PY

      - name: Report metered budget failure
        if: ${{ steps.metered_budget.outcome == 'failure' }}
        run: |
          echo "::warning::Paid searches skipped because their durable budget could not be verified or reserved."
          echo "Paid searches skipped: budget reservation failed. Review the reservation step before rerunning." >> "$GITHUB_STEP_SUMMARY"

      - name: Digest
        id: digest
        working-directory: jobsweep
        run: |
          jobsweep digest --days 1 --format md --out "$RUNNER_TEMP/digest.md"
          jobsweep digest --days 1 --format json --out "$RUNNER_TEMP/digest.json"
          new_count=$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('total', len(d.get('items', []))))" "$RUNNER_TEMP/digest.json" 2>/dev/null || echo 0)
          echo "new_count=$new_count" >> "$GITHUB_OUTPUT"
          { echo "## Job sweep digest"; echo; cat "$RUNNER_TEMP/digest.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Export static board
        working-directory: jobsweep
        # Export only needs credential presence, never the secret values.
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY != '' && 'configured' || '' }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL != '' && 'configured' || '' }}
          PIPEWORX_API_KEY: ${{ secrets.PIPEWORX_API_KEY != '' && 'configured' || '' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID != '' && 'configured' || '' }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY != '' && 'configured' || '' }}
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY != '' && 'configured' || '' }}
          HASDATA_API_KEY: ${{ secrets.HASDATA_API_KEY != '' && 'configured' || '' }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN != '' && 'configured' || '' }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN != '' && 'configured' || '' }}
        run: jobsweep export --out "$RUNNER_TEMP/site"

      - name: Save state to the state branch
        run: |
          jobsweep state prune --days 120 || true
          jobsweep state export "$RUNNER_TEMP/state.json.gz" --max-description 20000
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          wt="$RUNNER_TEMP/state-wt"
          mkdir -p "$wt/history"
          # Carry the earlier daily digests forward; the branch keeps a single commit so the repo never grows.
          if git fetch --depth=1 origin "$STATE_BRANCH" 2>/dev/null; then
            git archive "origin/$STATE_BRANCH" history 2>/dev/null | tar -x -C "$wt" || true
            # Always preserve the durable ledger, including reservations from interrupted runs.
            if git cat-file -e "origin/$STATE_BRANCH:metered-budget.json" 2>/dev/null; then
              git show "origin/$STATE_BRANCH:metered-budget.json" > "$wt/metered-budget.json"
            fi
          else
            # Never overwrite an unreadable branch and lose earlier spend reservations.
            echo "::error::Cannot preserve state branch; refusing to replace it."
            exit 1
          fi
          day=$(date -u +%F)
          cp "$RUNNER_TEMP/state.json.gz" "$wt/state.json.gz"
          cp "$RUNNER_TEMP/digest.md" "$wt/digest.md"
          cp "$RUNNER_TEMP/digest.md" "$wt/history/$day.md"
          printf '# jobsweep state\n\nMachine-written by the daily sweep. `state.json.gz` is the database snapshot;\n`history/` holds one digest per day.\n' > "$wt/README.md"
          cd "$wt"
          git init -q -b "$STATE_BRANCH"
          git add -A
          git commit -q -m "jobsweep state $day"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$STATE_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish the board to the gh-pages branch
        if: ${{ github.event_name == 'schedule' || inputs.publish_pages }}
        run: |
          cd "$RUNNER_TEMP/site"
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git commit -q -m "jobsweep board $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload digest and report
        uses: actions/upload-artifact@v7
        with:
          name: jobsweep-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/digest.md
            ${{ runner.temp }}/digest.json
            ${{ runner.temp }}/sweep-report.json
            ${{ runner.temp }}/metered-report.json
            ${{ runner.temp }}/metered-budget-summary.txt
          retention-days: 30

      - name: Open or update the digest issue
        if: ${{ (github.event_name == 'schedule' || inputs.open_issue) && steps.digest.outputs.new_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash jobsweep/scripts/gh_digest_issue.sh "$RUNNER_TEMP/digest.md" "$(date -u +%F)"
